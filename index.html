    // =========================================================================

    function showToast(message, type = "info") {
      const container = document.getElementById("toastContainer");
      if (!container) return;

      const colors = {
        success: "bg-[#1f6f43] text-white border-[#175432]",
        error: "bg-[#8f1d2c] text-white border-[#6d1420]",
        info: "bg-[#171717] text-white border-[#333333]"
      };

      const toast = document.createElement("div");
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-lg text-xs font-semibold flex items-center justify-between gap-3 transition-all duration-300 opacity-0 -translate-y-2 ${colors[type] || colors.info}`;
      toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove("opacity-0", "-translate-y-2");
      });

      setTimeout(() => {
        toast.classList.add("opacity-0", "-translate-y-2");
        setTimeout(() => toast.remove(), 300);
      }, 3400);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getCacheKeyForArtwork(art) {
      return `${(art.title || "").trim().toLowerCase()}::${(art.artist || "").trim().toLowerCase()}`;
    }

    function saveImageCache() {
      try {
        localStorage.setItem(IMG_CACHE_STORAGE_KEY, JSON.stringify(state.imageCache));

    }

    // =========================================================================
    // AUTOMATIC IMAGE RESOLVER (WIKIPEDIA IT/EN + WIKIMEDIA COMMONS)
    // =========================================================================
    async function searchWikipediaThumbnail(lang, query) {
      const cleanQuery = query.trim();
      if (!cleanQuery) return null;
      const endpoint = `https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(cleanQuery)}&gsrlimit=4&prop=pageimages&piprop=thumbnail&pithumbsize=700&format=json&origin=*`;
      const res = await fetch(endpoint);
      if (!res.ok) return null;
      const data = await res.json();
      const pages = data?.query?.pages;
      if (!pages) return null;

      // Sort by search index so the top search result is chosen first
      const sortedPages = Object.values(pages).sort((a, b) => (a.index || 99) - (b.index || 99));
      for (const page of sortedPages) {
        if (page?.thumbnail?.source) {
          const src = page.thumbnail.source;
          // Avoid generic SVG icons or maps if better photo exists
          if (!src.toLowerCase().endsWith(".svg") && !src.toLowerCase().includes("flag_of_")) {
            return src;
          }
        }
      }
      return null;
    }

    async function searchWikimediaCommonsImage(query) {
      const cleanQuery = query.trim();
      if (!cleanQuery) return null;
      // Search File namespace (gsrnamespace=6) on Wikimedia Commons
      const endpoint = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(cleanQuery)}&gsrnamespace=6&gsrlimit=5&prop=imageinfo&iiprop=url&iiurlwidth=700&format=json&origin=*`;
      const res = await fetch(endpoint);
      if (!res.ok) return null;
      const data = await res.json();
      const pages = data?.query?.pages;
      if (!pages) return null;

      const sortedPages = Object.values(pages).sort((a, b) => (a.index || 99) - (b.index || 99));
      for (const page of sortedPages) {
        const info = page?.imageinfo?.[0];
        const url = info?.thumburl || info?.url;
        if (url && !url.toLowerCase().endsWith(".svg") && !url.toLowerCase().endsWith(".pdf")) {
          return url;
        }
      }
      return null;
    }

    async function fetchBestArtworkImageUrl(title, artist, museum = "", category = "") {
      const cleanTitle = (title || "").replace(/\(.*?\)/g, "").trim();
      const cleanArtist = (artist || "").replace(/Architettura.*|Scuola.*|Autore ignoto/gi, "").trim();

      // Build smart progressive search queries
      const queriesIt = [
        cleanArtist ? `${cleanTitle} ${cleanArtist}` : cleanTitle,
        cleanTitle,
        museum && cleanTitle !== museum ? `${museum}` : ""
      ].filter(Boolean);

      // 1. Try Italian Wikipedia
      for (const q of queriesIt) {
        try {
          const url = await searchWikipediaThumbnail("it", q);
          if (url) return url;
        } catch (e) {}
      }

      // 2. Try English Wikipedia
      for (const q of queriesIt) {
        try {
          const url = await searchWikipediaThumbnail("en", q);
          if (url) return url;
        } catch (e) {}
      }

      // 3. Fallback to Wikimedia Commons file search
      const commonsQuery = cleanArtist ? `${cleanTitle} ${cleanArtist}` : `${cleanTitle} ${museum}`;
      try {
        const commonsUrl = await searchWikimediaCommonsImage(commonsQuery);
        if (commonsUrl) return commonsUrl;
      } catch (e) {}

      return null;
    }

    function getEffectiveImageUrl(artwork) {
      const cacheKey = getCacheKeyForArtwork(artwork);
      // If we resolved a verified URL in this session/cache and it hasn't failed, prefer it
      if (state.imageCache[cacheKey] && !state.failedCacheKeys.has(cacheKey)) {
        return state.imageCache[cacheKey];
      }
      // Otherwise use DB image_url if present and not marked broken
      if (artwork.image_url && artwork.image_url.trim() !== "" && !artwork._dbImgFailed) {
        return artwork.image_url.trim();
      }
      return "";
    }

    async function resolveMissingImageForArtwork(artwork, forceRefresh = false) {
      const key = String(artwork.id || getCacheKeyForArtwork(artwork));
      const cacheKey = getCacheKeyForArtwork(artwork);

      if (state.resolvingIds.has(key)) return;
      if (!forceRefresh && state.imageCache[cacheKey] && !state.failedCacheKeys.has(cacheKey)) {
        return;
      }

      state.resolvingIds.add(key);
      updateCardImageDom(artwork.id, "", true);

      try {
        const foundUrl = await fetchBestArtworkImageUrl(
          artwork.title,
          artwork.artist,
          artwork.museum,
          artwork.category
        );

        if (foundUrl) {
          state.failedCacheKeys.delete(cacheKey);
          state.imageCache[cacheKey] = foundUrl;
          artwork.image_url = foundUrl;
          artwork._dbImgFailed = false;
          saveImageCache();
          updateCardImageDom(artwork.id, foundUrl, false);

          // Automatically persist back to Supabase artworks.image_url if logged in as curator!
          if (
            state.client &&
            state.user &&
            state.profile?.is_curator &&
            artwork.id &&
            !String(artwork.id).startsWith("demo-")
          ) {
            await state.client
              .from("artworks")
              .update({ image_url: foundUrl })
              .eq("id", artwork.id);
          }
        } else {
          updateCardImageDom(artwork.id, "", false);
        }
      } finally {
        state.resolvingIds.delete(key);
      }
    }

    function handleArtworkImageError(artworkId) {
      const art = state.artworks.find(a => String(a.id) === String(artworkId));
      if (!art) return;
      const cacheKey = getCacheKeyForArtwork(art);

      if (state.imageCache[cacheKey]) {
        state.failedCacheKeys.add(cacheKey);
      }
      art._dbImgFailed = true;

      // Trigger automatic resolution immediately when a URL fails to load
      if (!art._autoRetried) {
        art._autoRetried = true;
        resolveMissingImageForArtwork(art, true);
      } else {
        updateCardImageDom(artworkId, "", false);
      }

    function manualRetryArtworkImage(artworkId) {
      const art = state.artworks.find(a => String(a.id) === String(artworkId));

      art._dbImgFailed = false;
      resolveMissingImageForArtwork(art, true);

    // Queue automatic image resolution for visible artworks missing an image
    async function resolveVisibleMissingImages(artworksList) {
      const missing = artworksList.filter(a => !getEffectiveImageUrl(a) && !a._autoRetried);
      if (missing.length === 0) return;

      // Process in small batches of 3 to avoid overwhelming mobile network / Wikipedia API
      const batchSize = 3;
      for (let i = 0; i < missing.length; i += batchSize) {
        const batch = missing.slice(i, i + batchSize);
        await Promise.all(
          batch.map(art => {
            art._autoRetried = true;
            return resolveMissingImageForArtwork(art, false);
          })
        );
      }
    }

    function initSupabase() {
      try {
        if (state.supabaseUrl && state.supabaseKey && window.supabase) {
          state.client = window.supabase.createClient(
            state.supabaseUrl.trim(),
            state.supabaseKey.trim()

        console.error("Supabase init error:", err);

    async function refreshSessionAndData() {
      initSupabase();
      if (!state.client) {
        updateBadge(false);
        render();
        return;
      }

      try {
        const { data: sessionData } = await state.client.auth.getSession();
        state.user = sessionData?.session?.user || null;

        if (state.user) {
          const { data: prof } = await state.client
            .from("profiles")
            .select("*")
            .eq("id", state.user.id)
            .single();
          state.profile = prof || null;
        } else {
          state.profile = null;
        }

        const { data: approved, error: artErr } = await state.client
          .from("artworks")
          .select("*")
          .eq("status", "approved")
          .order("created_at", { ascending: false });

        if (!artErr && Array.isArray(approved) && approved.length > 0) {
          state.artworks = approved;
        } else {
          state.artworks = [...DEMO_ARTWORKS];
        }

        const { data: revRows, error: revErr } = await state.client
          .from("reviews")
          .select("id, artwork_id, user_id, rating, created_at");

        if (!revErr && Array.isArray(revRows)) {
          state.reviews = revRows;
        }

        if (state.profile?.is_curator) {
          const { data: pending } = await state.client
            .from("artworks")
            .select("*")
            .eq("status", "pending")
            .order("created_at", { ascending: false });
          state.pendingArtworks = pending || [];
        } else {
          state.pendingArtworks = [];
        }

        updateBadge(!artErr);
      } catch (e) {
        console.error("Sync error:", e);
        updateBadge(false);
      }

      updateCuratorBadge();
      render();
    }

    function getFilteredArtworks(categoryOverride = null) {
      const q = state.searchQuery.trim().toLowerCase();
      const cat = categoryOverride || state.selectedCategory;

      return state.artworks.filter(a => {
        const itemCat = (a.category || "").toLowerCase();
        const matchesCat = cat === "Tutte" || itemCat === cat.toLowerCase();
        if (!matchesCat) return false;

        if (categoryOverride) return true;
        if (!q) return true;

        const haystack = [
          a.title,
          a.artist,
          a.museum,
          a.city,
          a.category,
          a.era
        ].join(" ").toLowerCase();

        return haystack.includes(q);
      });
    }

    // =========================================================================
    // 1-TO-10 STAR RATING SYSTEM
    // =========================================================================
    function getArtworkRatingStats(artworkId) {
      const itemReviews = state.reviews.filter(r => String(r.artwork_id) === String(artworkId));
      const count = itemReviews.length;
      const avg = count > 0
        ? (itemReviews.reduce((acc, r) => acc + Number(r.rating || 0), 0) / count).toFixed(1)
        : null;

      const actorKey = state.user ? state.user.id : "local-guest";
      const myReview = itemReviews.find(r =>
        (state.user && r.user_id === state.user.id) ||
        (!state.user && r.local_actor === actorKey)
      );

      return {
        count,
        avg,
        myRating: myReview ? Number(myReview.rating) : 0
      };
    }

    async function rateArtwork(artworkId, score) {
      const numericScore = Math.max(1, Math.min(10, Number(score)));

      if (state.client && state.user) {
        const existing = state.reviews.find(
          r => String(r.artwork_id) === String(artworkId) && r.user_id === state.user.id
        );

        let error = null;
        if (existing && existing.id && !String(existing.id).startsWith("local-")) {
          const res = await state.client
            .from("reviews")
            .update({ rating: numericScore })
            .eq("id", existing.id);
          error = res.error;
        } else {
          const res = await state.client
            .from("reviews")
            .insert({
              artwork_id: artworkId,
              user_id: state.user.id,
              rating: numericScore
            });
          error = res.error;
        }

        if (error) {
          showToast("Errore salvataggio voto: " + error.message, "error");
          return;
        }
        showToast(`Voto registrato: ${numericScore}/10 ★`, "success");
        await refreshSessionAndData();
      } else {
        const localActor = "local-guest";
        const idx = state.reviews.findIndex(
          r => String(r.artwork_id) === String(artworkId) && r.local_actor === localActor
        );
        const entry = {
          id: "local-" + artworkId + "-" + Date.now(),
          artwork_id: artworkId,
          rating: numericScore,
          local_actor: localActor
        };
        if (idx >= 0) {
          state.reviews[idx] = entry;
        } else {
          state.reviews.push(entry);
        }
        localStorage.setItem("vernice_local_reviews", JSON.stringify(state.reviews));
        showToast(`Voto salvato localmente: ${numericScore}/10 ★`, "info");
        if (state.tab === "artworks") {
          renderArtworksListOnly();
        } else {
          render();
        }
      }
    }

    // =========================================================================
    // INTERACTIVE LEAFLET MAP
    // =========================================================================
    function resolveArtworkCoords(artwork, index) {
      if (
        artwork.lat !== null &&
        artwork.lat !== undefined &&
        artwork.lng !== null &&
        artwork.lng !== undefined &&
        !isNaN(Number(artwork.lat)) &&
        !isNaN(Number(artwork.lng))
      ) {
        return [Number(artwork.lat), Number(artwork.lng)];
      }

      const rawCity = (artwork.city || "").toLowerCase().trim();
      let baseCoords = null;

      for (const [key, coords] of Object.entries(CITY_COORDS)) {
        if (rawCity === key || rawCity.includes(key)) {
          baseCoords = coords;
          break;
        }
      }

      if (!baseCoords) {
        baseCoords = [42.5000, 12.5000];
      }

      const seed = String(artwork.id || artwork.title || index)
        .split("")
        .reduce((acc, ch) => acc + ch.charCodeAt(0), index * 17);
      const angle = (seed * 137.508) * (Math.PI / 180);
      const radius = 0.004 + ((seed % 7) * 0.0018);

      return [
        baseCoords[0] + Math.cos(angle) * radius,
        baseCoords[1] + Math.sin(angle) * radius
      ];
    }

    function initInteractiveMap() {
      const mapEl = document.getElementById("verniceMap");
      if (!mapEl || typeof L === "undefined") return;

      if (state.mapInstance) {
        state.mapInstance.remove();
        state.mapInstance = null;
      }

      const map = L.map("verniceMap", {
        zoomControl: true,
        attributionControl: true
      }).setView([43.5, 11.5], 5);

      L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        subdomains: "abcd",
        maxZoom: 19
      }).addTo(map);

      state.mapInstance = map;
      state.markersLayer = L.layerGroup().addTo(map);

      renderMapMarkers();
    }

    function renderMapMarkers() {
      if (!state.mapInstance || !state.markersLayer) return;
      state.markersLayer.clearLayers();

      const items = getFilteredArtworks(state.mapCategory);
      const countEl = document.getElementById("mapCountLabel");
      if (countEl) {
        countEl.textContent = `${items.length} ${items.length === 1 ? "luogo" : "luoghi"} sulla mappa`;
      }

      const bounds = [];

      items.forEach((art, idx) => {
        const [lat, lng] = resolveArtworkCoords(art, idx);
        bounds.push([lat, lng]);

        const catLower = (art.category || "").toLowerCase();
        let pinClass = "vernice-pin";
        let symbol = "✦";
        if (catLower === "museo") {
          pinClass += " museum";
          symbol = "🏛";
        } else if (catLower === "scultura") {
          pinClass += " sculpture";
          symbol = "🗿";
        } else if (catLower === "architettura") {
          symbol = "⛪";
        }

        const customIcon = L.divIcon({
          className: "",
          html: `<div class="${pinClass}">${symbol}</div>`,
          iconSize: [30, 30],
          iconAnchor: [15, 15],
          popupAnchor: [0, -14]
        });

        const stats = getArtworkRatingStats(art.id);
        const ratingText = stats.avg ? `★ ${stats.avg}/10 (${stats.count})` : "☆ Ancora nessun voto";
        const effectiveImg = getEffectiveImageUrl(art);

        const popupHtml = `
          <div class="bg-white text-[#171717]">
            ${effectiveImg ? `<img src="${escapeHtml(effectiveImg)}" alt="${escapeHtml(art.title)}" class="w-full h-28 object-cover bg-[#ece8e0]" onerror="this.style.display='none'" />` : ""}
            <div class="p-3">
              <div class="flex items-center justify-between gap-1 mb-1">
                <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-[#f5efe4] text-[#c85a32]">${escapeHtml(art.category || "Opera")}</span>
                <span class="text-[11px] font-extrabold text-[#b88a2d]">${ratingText}</span>
              </div>
              <h4 class="font-bold text-sm leading-snug text-[#171717]">${escapeHtml(art.title)}</h4>
              <p class="text-xs text-[#66635e] font-medium mt-0.5">${escapeHtml(art.artist)}</p>
              <p class="text-[11px] text-[#171717] mt-1.5"><strong>${escapeHtml(art.museum || "")}</strong> • ${escapeHtml(art.city || "")}</p>
              <button
                type="button"
                onclick="jumpToArtworkInCatalog('${escapeHtml(art.title).replace(/'/g, "\\'")}')"
                class="mt-2.5 w-full py-1.5 px-3 rounded-lg bg-[#8f1d2c] text-white text-xs font-bold hover:bg-[#741623] transition"
              >
                Apri & Vota nel Catalogo
              </button>
            </div>
          </div>
        `;

        const marker = L.marker([lat, lng], { icon: customIcon }).bindPopup(popupHtml);
        marker.on("popupopen", async () => {
          // If image wasn't resolved yet when popup opens, resolve it automatically
          if (!getEffectiveImageUrl(art)) {
            await resolveMissingImageForArtwork(art, false);
            const updatedImg = getEffectiveImageUrl(art);
            if (updatedImg) {
              marker.setPopupContent(`
                <div class="bg-white text-[#171717]">
                  <img src="${escapeHtml(updatedImg)}" alt="${escapeHtml(art.title)}" class="w-full h-28 object-cover bg-[#ece8e0]" onerror="this.style.display='none'" />
                  <div class="p-3">
                    <div class="flex items-center justify-between gap-1 mb-1">
                      <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-[#f5efe4] text-[#c85a32]">${escapeHtml(art.category || "Opera")}</span>
                      <span class="text-[11px] font-extrabold text-[#b88a2d]">${ratingText}</span>
                    </div>
                    <h4 class="font-bold text-sm leading-snug text-[#171717]">${escapeHtml(art.title)}</h4>
                    <p class="text-xs text-[#66635e] font-medium mt-0.5">${escapeHtml(art.artist)}</p>
                    <p class="text-[11px] text-[#171717] mt-1.5"><strong>${escapeHtml(art.museum || "")}</strong> • ${escapeHtml(art.city || "")}</p>
                    <button
                      type="button"
                      onclick="jumpToArtworkInCatalog('${escapeHtml(art.title).replace(/'/g, "\\'")}')"
                      class="mt-2.5 w-full py-1.5 px-3 rounded-lg bg-[#8f1d2c] text-white text-xs font-bold hover:bg-[#741623] transition"
                    >
                      Apri & Vota nel Catalogo
                    </button>
                  </div>
                </div>
              `);
            }
          }
        });
        state.markersLayer.addLayer(marker);
      });

      if (bounds.length > 0 && state.mapCategory !== "Tutte") {
        state.mapInstance.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
      }
    }

    async function submitArtwork() {
      if (!state.client || !state.user) {
        return showToast("Accedi prima nella scheda Profilo & Play per proporre un'opera.", "error");
      }

      const title = document.getElementById("artTitle").value.trim();
      const artist = document.getElementById("artArtist").value.trim();
      const museum = document.getElementById("artMuseum").value.trim();
      const city = document.getElementById("artCity").value.trim();
      let imageUrl = document.getElementById("artImg").value.trim();

      if (!title || !artist || !museum || !city) {
        return showToast("Compila almeno titolo, artista, museo e città.", "error");
      }

      // Automatically resolve image if user left URL empty
      if (!imageUrl) {
        showToast("Ricerca immagine automatica in corso...", "info");
        const autoUrl = await fetchBestArtworkImageUrl(title, artist, museum);
        if (autoUrl) imageUrl = autoUrl;
      }

      const latRaw = document.getElementById("artLat").value.trim();
      const lngRaw = document.getElementById("artLng").value.trim();

      const payload = {
        title,
        artist,
        year: document.getElementById("artYear").value.trim(),
        category: document.getElementById("artCategory").value,
        era: document.getElementById("artEra").value,
        museum,
        city,
        description: document.getElementById("artDesc").value.trim(),
        image_url: imageUrl,
        status: "pending",
        submitted_by: state.user.id
      };

      if (latRaw && !isNaN(Number(latRaw))) payload.lat = Number(latRaw);
      if (lngRaw && !isNaN(Number(lngRaw))) payload.lng = Number(lngRaw);

      const { error } = await state.client.from("artworks").insert(payload);
      if (error) {
        showToast("Errore invio proposta: " + error.message, "error");
      } else {
        showToast("Opera inviata in revisione!", "success");
        await refreshSessionAndData();
        setTab(state.profile?.is_curator ? "curator" : "artworks");
      }
    }

    async function moderateArtwork(id, status) {
      if (!state.client) return;
      const { error } = await state.client.from("artworks").update({ status }).eq("id", id);
      if (error) {
        showToast("Errore moderazione: " + error.message, "error");
      } else {
        showToast(status === "approved" ? "Opera approvata e pubblicata!" : "Proposta rifiutata.", "success");
        await refreshSessionAndData();
      }
    }
